services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '4000:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev -- --host
