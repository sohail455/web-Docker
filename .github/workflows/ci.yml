name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t sohailtalat/webapp -f Dockerfile.dev .

      - name: Run Tests
        run: docker run -e CI=true sohailtalat/webapp npm test

      - name: Run ESLint
        run: docker run -e CI=true sohailtalat/webapp npm run lint

      - name: Build React App
        run: docker run -e CI=true sohailtalat/webapp npm run build
